name: Desbloqueo HTTPS automático (cada hora)

# Hasta que https://www.mascafé.com responda con certificado válido.
# Usa Secrets: GODADDY_*, GH_PAGES_PAT, opcional CLOUDFLARE_*.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unblock-https-hourly.yml"
      - "scripts/auto-unblock-https.mjs"
      - "scripts/setup-cloudflare-https.mjs"
      - ".cloud-agent/https-trigger.json"

permissions:
  contents: write
  pages: write

concurrency:
  group: unblock-https-hourly
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAGES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Comprobar si HTTPS ya activo
        id: check
        run: |
          if grep -q '"httpsReady": true' content/settings.json 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ httpsReady ya true — omitiendo"
            exit 0
          fi
          CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "https://www.xn--mascaf-gva.com/" || echo "0")
          echo "https_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ HTTPS responde 200 — omitiendo"
          fi

      - name: Validar credenciales
        if: steps.check.outputs.skip != 'true'
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_PAT || github.token }}
        run: node scripts/validate-credentials.mjs

      - name: Auto-desbloqueo HTTPS
        if: steps.check.outputs.skip != 'true'
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_PAT || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/auto-unblock-https.mjs

      - name: Commit settings si HTTPS activo
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/settings.json content/informe-requisitos.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore(seo): HTTPS activo en mascafé.com [auto-unblock]"
          git push

      - run: node scripts/verify-domain.mjs || true
